<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us and the rafting company name </title>
    <meta name="description"
      content="White water rafting is an exciting outdoor adventure, and we are thrilled to have you experience the wonders of it">
    <meta name="author" content="Njoku Benelyn C.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="top-bar">
        <div class="logo">
            <img src="images/z-splash.png" alt="Logo">
        </div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
        <section class="company-info">
            <h1>Splash Whitewater Rafting Adventures</h1>
            <p>123 Main River Street</p>
            <p>Kolob, Califomia</p>
            <p>+1 999 999 9999</p>
            <p>info@splashwhitewater.com</p>
        </section>

        <section class="contact-section">
            <div class="map">
                <iframe src="https://www.google.com/maps?q=Kolob,California&output=embed"
                  allowfullscreen="" loading="lazy">
                </iframe>
            </div>

            <form class="contact-form">

                <label for="fullname">Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Placeholder">


                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Placeholder">


                <!-- <form class="message-purpose"> -->
                <!-- <div class="message-purpose"> -->
                <!-- <legend>Message Purpose</legend> -->
                <label>Message Purpose</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                    <!-- </div> -->

                </div>
                <!-- </fieldset> -->
                <div class="message">
                    <label></label>Message</label>
                    <textarea name="message" id="messsage" rows="4"
                      placeholder="Type here"></textarea>
                </div>
                <label for="checkbox">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>
                <button type="submit">Get in Touch!</button>

            </form>
        </section>

        <section>
            <h2>We Are Here to Serve You</h2>

            <div class="team-grid">
                <figure class="employee">
                    <img src="images/roaring-waters1.jpg" alt="Employee Profile Image">
                    <figcaption>Joben Doe - Lead River Guide</figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/rapid-descent1.jpg" alt="Employee Profile Image">
                    <figcaption>Jane Smith - Safethy Instructor</figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/wildriver1.jpg" alt="Employee Profile Image">
                    <figcaption>Micheal Lee - Trip Coordinator</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Footer Content including Social Media Icon/Links</p>
        <nav class="socialmedia">
            <a href="https://facebook.ocm">
                <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://Linkedin.com">
                <img src="images/linkedin-square.svg" alt="Linkedin Icon">
            </a>
            <a href="http://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
