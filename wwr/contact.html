<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us and the rafting company name </title>
    <meta name="description"
      content="White water rafting is an exciting outdoor adventure, and we are thrilled to have you experience the wonders of it">
    <meta name="author" content="Njoku Benelyn C.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="top-bar">
        <div class="logo">
            <img src="images/z-splash.png" alt="Logo">
        </div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>Splash White Water Rafting Company</h1>
            <p>9310 Fanita Parkway</p>
            <p>Santee, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-section">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d107262.88892011803!2d-117.04046748526424!3d32.84617098345136!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80dbfd3df76514c9%3A0x2a942af638f17b21!2sSantee%20Lakes%20Recreation%20Preserve!5e0!3m2!1sen!2sng!4v1775371908547!5m2!1sen!2sng"
                  width="400" height="500" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder">

                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Placeholder">

                <label>Message Purpose</label>
                <div class="radio-group">
                    <label><input type="radio" id="general" name="message"> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="message"> Reservation
                        Question</label>
                    <label><input type="radio" id="website" name="message"> Website
                        Suggestion</label>
                </div>

                <label for="message" class="message-label">Message</label>
                <textarea name="message" id="message" rows="4" placeholder="Type here"></textarea>

                <label class="checkbox">
                    <input type="checkbox" id="checkbox" name="checkbox">Please Subscribe me to the
                    monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>
        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure class="employee">
                    <img src="images/john-doe.jpeg" alt="Employee Profile Image" height="140">
                    <figcaption>John Doe - Lead River Guide</figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/jane-smith.jpeg" alt="Employee Profile Image" height="140">
                    <figcaption>Jane Smith - Safety Instructor</figcaption>
                </figure>

                <figure class="employee">
                    <img src="images/micheal-lee.jpg" alt="Employee Profile Image" height="140">
                    <figcaption>Micheal Lee - Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>©2026 ❖ Footer Content including Social Media Icons/Links</p>
        <nav class="socialmedia">
            <div><a href="https://facebook.ocm">
                    <img src="images/facebook-square.svg" alt="Facebook Icon">
                </a></div>
            <div><a href="https://Linkedin.com">
                    <img src="images/linkedin-square.svg" alt="Linkedin Icon">
                </a></div>
            <div><a href="http://instagram.com">
                    <img src="images/instagram-square.svg" alt="Instagram Icon">
                </a></div>
        </nav>
    </footer>

</body>

</html>
