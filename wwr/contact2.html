<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us and the rafting company name </title>
    <meta name="description"
      content="White water rafting is an exciting outdoor adventure, and we are thrilled to have you experience the wonders of it">
    <meta name="author" content="Njoku Benelyn C.">
    <link rel="stylesheet" href="styles/rafting1.css">
</head>

<body>
    <header class="top-bar">
        <div class="logo"></div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Trips</a>
            <a href="#">Contact Us</a>
        </nav>
    </header>

    <section class="company-info">
        <h1>White Water Rafting Company</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>info@whitewater.com</p>
    </section>

    <section class="contact-section">

        <!-- GOOGLE MAP (no inline style) -->
        <div class="map">
            <iframe src="https://www.google.com/maps?q=Kolob,California&output=embed"
              allowfullscreen="" loading="lazy">
            </iframe>
        </div>

        <!-- FORM -->
        <form class="contact-form">

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <fieldset>
                <legend>Message Purpose</legend>

                <label>
                    <input type="radio" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="suggestion">
                    Website Suggestion
                </label>
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <label class="checkbox">
                <input type="checkbox" name="subscribe">
                Please subscribe me to the monthly newsletter
            </label>

            <!-- IMPROVED BUTTON -->
            <button type="submit" class="submit-btn">
                Send Message
            </button>

        </form>
    </section>

    <!-- EMPLOYEE SECTION -->
    <section class="team">
        <h2>We Are Here to Serve You</h2>

        <div class="team-grid">

            <figure class="employee">
                <div class="img"></div>
                <figcaption>John Doe - Lead River Guide</figcaption>
            </figure>

            <figure class="employee">
                <div class="img"></div>
                <figcaption>Jane Smith - Safety Instructor</figcaption>
            </figure>

            <figure class="employee">
                <div class="img"></div>
                <figcaption>Michael Lee - Trip Coordinator</figcaption>
            </figure>

        </div>
    </section>

    <footer class="footer">
        <p>Footer Content including Social Media Icons/Links</p>
        <div class="icons">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </footer>

</body>

</html>
