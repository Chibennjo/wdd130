<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>WDD 130 | HTML Form - User Poll</header>

    <h1>Contact Information</h1>

    <div class="form-item">
        <div class="form-item column2">
            <label for="full name">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
        </div>
    </div>
    <div class="form-item">
        <div class="form-item column2">
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail">
        </div>
    </div>
    </form>

    <h1>Questions</h1>
    <div class="form-item column1">
        <label for="quantity">Select Quantity</label>
        <select name="quantity" id="quantity">
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
        </select>
    </div>
    <div class="form-item">
        <div class="form-item column1">
            <label for="browser">What is your favorite internet brower?</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="safari">safari</option>
                <option value="Edge">Edge</option>
                <option value="brave">Brave</option>
            </select>
        </div>
    </div>

    <div class="form-item">
        <div class="form-item column1">
            <label for="question">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </div>
    </div>
    <label for="feedback">List the places you have lived:</label>
    <textarea name="feedback" id="feedback" rows="4"
      placeholder="Owerri, portharcourt,Asaba, Onitsha"></textarea>
    <button type="submit">Submit Poll</button>
</body>
<footer>
    ©2024 | HTML Form - User Poll Activity | Njoku Benelyn
</footer>

</html>
